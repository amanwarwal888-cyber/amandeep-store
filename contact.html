<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Store</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a class="nav-brand" href="index.html"><span class="brand-mark">S</span>Store</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="terms.html">Terms</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="container" style="max-width:600px; padding:48px 24px 64px;">
  <h1>Contact</h1>
  <div class="card" id="contact-body">Loading…</div>
</main>

<footer class="site-footer"><div class="container">&copy; <span id="year"></span> Amandeep Singh. All rights reserved.</div></footer>

<script type="module">
import { db, doc, getDoc } from './firebase-init.js';
document.getElementById('year').textContent = new Date().getFullYear();

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

(async () => {
  const snap = await getDoc(doc(db, 'site_content', 'main'));
  const c = snap.exists() ? snap.data() : {};
  const body = document.getElementById('contact-body');

  if (!c.contactEmail && !c.contactPhone && !c.contactAddress) {
    body.innerHTML = `<p>Contact details have not been added yet.</p>`;
    return;
  }

  body.innerHTML = `
    ${c.contactEmail ? `<h3>Email</h3><p><a href="mailto:${escapeHtml(c.contactEmail)}">${escapeHtml(c.contactEmail)}</a></p>` : ''}
    ${c.contactPhone ? `<h3>Phone</h3><p><a href="tel:${escapeHtml(c.contactPhone)}">${escapeHtml(c.contactPhone)}</a>${c.contactAltPhone ? `<br>Alternate: <a href="tel:${escapeHtml(c.contactAltPhone)}">${escapeHtml(c.contactAltPhone)}</a>` : ''}</p>` : ''}
    ${c.contactAddress ? `<h3>Address</h3><p>${escapeHtml(c.contactAddress).replace(/\n/g,'<br>')}</p>` : ''}
  `;
})();
</script>
</body>
</html>
