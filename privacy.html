<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy — Store</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a class="nav-brand" href="index.html"><span class="brand-mark">S</span>Store</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="terms.html">Terms</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="container" style="max-width:760px; padding:48px 24px 64px;">
  <h1>Privacy Policy</h1>
  <div id="privacy-body" style="white-space:pre-wrap; color:#5F6B7A;">Loading…</div>
</main>

<footer class="site-footer"><div class="container">&copy; <span id="year"></span> Amandeep Singh. All rights reserved.</div></footer>

<script type="module">
import { db, doc, getDoc } from './firebase-init.js';
document.getElementById('year').textContent = new Date().getFullYear();

const DEFAULT_TEXT = `This Privacy Policy explains how we handle information when you use this store.

Information We Collect
When you register, we collect your name, email address, and mobile number. When you request a purchase, we record the product and quantity requested.

How Your Data Is Used
This information is used only to process your registration and purchase requests, and to contact you about them.

Data Sharing
We do not sell your personal data to third parties.

Contact
If you have questions about this policy, use the Contact page.`;

(async () => {
  const snap = await getDoc(doc(db, 'site_content', 'main'));
  const text = (snap.exists() && snap.data().privacyText) ? snap.data().privacyText : DEFAULT_TEXT;
  document.getElementById('privacy-body').textContent = text;
})();
</script>
</body>
</html>
