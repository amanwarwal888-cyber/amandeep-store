<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Store</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a class="nav-brand" href="index.html">
      <span class="brand-mark">S</span>
      Store Admin
    </a>
    <span id="admin-account-area"></span>
  </nav>
</header>

<!-- Login screen -->
<div class="admin-login-shell" id="login-shell">
  <div class="card">
    <h2>Admin sign in</h2>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email">
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password">
    </div>
    <button class="btn btn-primary btn-block" id="login-btn">Sign in</button>
    <div class="form-message" id="login-message"></div>
  </div>
</div>

<!-- Admin dashboard -->
<div class="admin-shell" id="admin-shell" style="display:none;">
  <aside class="admin-sidebar">
    <button class="tab-btn active" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="content">Site Content</button>
    <button class="tab-btn" data-tab="orders">Orders</button>
  </aside>

  <main class="admin-main">

    <!-- Products tab -->
    <section id="tab-products">
      <div class="row-between">
        <h2 style="margin:0;">Products</h2>
        <button class="btn btn-primary btn-sm" id="new-product-btn">+ Add product</button>
      </div>

      <div class="card" id="product-form-card" style="display:none; margin-top:16px;">
        <h3 id="product-form-title">Add product</h3>
        <input type="hidden" id="product-id">
        <div class="field"><label>Name</label><input type="text" id="p-name"></div>
        <div class="field"><label>Price (₹)</label><input type="number" id="p-price"></div>
        <div class="field"><label>Category</label><input type="text" id="p-category" placeholder="e.g. Groceries"></div>
        <div class="field"><label>Description</label><textarea id="p-description"></textarea></div>
        <div class="row">
          <button class="btn btn-primary" id="save-product-btn">Save</button>
          <button class="btn btn-outline" id="cancel-product-btn">Cancel</button>
        </div>
        <div class="form-message" id="product-message"></div>
      </div>

      <table class="admin-table" id="products-table">
        <thead><tr><th>Name</th><th>Category</th><th>Price</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Site content tab -->
    <section id="tab-content" style="display:none;">
      <h2>Site Content</h2>
      <div class="card">
        <h3>Contact details</h3>
        <div class="field"><label>Email</label><input type="email" id="c-email"></div>
        <div class="field"><label>Phone</label><input type="text" id="c-phone"></div>
        <div class="field"><label>Alternate phone</label><input type="text" id="c-altphone"></div>
        <div class="field"><label>Address</label><textarea id="c-address"></textarea></div>
      </div>
      <div class="card">
        <h3>Privacy Policy text</h3>
        <div class="field"><textarea id="c-privacy" style="min-height:220px;"></textarea></div>
      </div>
      <div class="card">
        <h3>Terms &amp; Conditions text</h3>
        <div class="field"><textarea id="c-terms" style="min-height:220px;"></textarea></div>
      </div>
      <button class="btn btn-primary" id="save-content-btn">Save all content</button>
      <div class="form-message" id="content-message"></div>
    </section>

    <!-- Orders tab -->
    <section id="tab-orders" style="display:none;">
      <h2>Purchase requests</h2>
      <table class="admin-table" id="orders-table">
        <thead><tr><th>Customer</th><th>Product</th><th>Qty</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

  </main>
</div>

<script type="module">
import {
  auth, db, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc, getDocs,
  query, orderBy, serverTimestamp, signInWithEmailAndPassword, onAuthStateChanged, signOut,
  ADMIN_EMAIL
} from './firebase-init.js';

const loginShell = document.getElementById('login-shell');
const adminShell = document.getElementById('admin-shell');
const adminAccountArea = document.getElementById('admin-account-area');

// ---- Login ----
document.getElementById('login-btn').onclick = async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const msg = document.getElementById('login-message');
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'form-message visible error';
  }
};

onAuthStateChanged(auth, (user) => {
  if (user && user.email === ADMIN_EMAIL) {
    loginShell.style.display = 'none';
    adminShell.style.display = 'flex';
    adminAccountArea.innerHTML = `<button class="btn btn-outline btn-sm" id="admin-signout">Sign out</button>`;
    document.getElementById('admin-signout').onclick = () => signOut(auth);
    loadProducts();
  } else {
    if (user) {
      // signed in but not the admin account
      signOut(auth);
      document.getElementById('login-message').textContent = 'This account is not authorized as admin.';
      document.getElementById('login-message').className = 'form-message visible error';
    }
    loginShell.style.display = 'block';
    adminShell.style.display = 'none';
    adminAccountArea.innerHTML = '';
  }
});

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.admin-main > section').forEach(s => s.style.display = 'none');
    document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
    if (btn.dataset.tab === 'content') loadContent();
    if (btn.dataset.tab === 'orders') loadOrders();
  };
});

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---- Products ----
async function loadProducts() {
  const tbody = document.querySelector('#products-table tbody');
  const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
  const snap = await getDocs(q);
  tbody.innerHTML = '';
  snap.forEach(d => {
    const p = d.data();
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(p.name)}</td>
      <td>${escapeHtml(p.category || '—')}</td>
      <td>₹${Number(p.price).toLocaleString('en-IN')}</td>
      <td>
        <button class="btn btn-outline btn-sm" data-edit="${d.id}">Edit</button>
        <button class="btn btn-danger btn-sm" data-delete="${d.id}">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editProduct(b.dataset.edit));
  tbody.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteProduct(b.dataset.delete));
}

document.getElementById('new-product-btn').onclick = () => {
  document.getElementById('product-id').value = '';
  document.getElementById('product-form-title').textContent = 'Add product';
  ['p-name','p-price','p-category','p-description'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('product-form-card').style.display = 'block';
};

document.getElementById('cancel-product-btn').onclick = () => {
  document.getElementById('product-form-card').style.display = 'none';
};

async function editProduct(id) {
  const snap = await getDoc(doc(db, 'products', id));
  const p = snap.data();
  document.getElementById('product-id').value = id;
  document.getElementById('product-form-title').textContent = 'Edit product';
  document.getElementById('p-name').value = p.name;
  document.getElementById('p-price').value = p.price;
  document.getElementById('p-category').value = p.category || '';
  document.getElementById('p-description').value = p.description || '';
  document.getElementById('product-form-card').style.display = 'block';
}

document.getElementById('save-product-btn').onclick = async () => {
  const id = document.getElementById('product-id').value;
  const data = {
    name: document.getElementById('p-name').value.trim(),
    price: parseFloat(document.getElementById('p-price').value) || 0,
    category: document.getElementById('p-category').value.trim(),
    description: document.getElementById('p-description').value.trim()
  };
  const msg = document.getElementById('product-message');
  if (!data.name || !data.price) {
    msg.textContent = 'Name and price are required.';
    msg.className = 'form-message visible error';
    return;
  }
  try {
    if (id) {
      await updateDoc(doc(db, 'products', id), data);
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, 'products'), data);
    }
    document.getElementById('product-form-card').style.display = 'none';
    loadProducts();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'form-message visible error';
  }
};

async function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  await deleteDoc(doc(db, 'products', id));
  loadProducts();
}

// ---- Site content ----
async function loadContent() {
  const snap = await getDoc(doc(db, 'site_content', 'main'));
  const c = snap.exists() ? snap.data() : {};
  document.getElementById('c-email').value = c.contactEmail || '';
  document.getElementById('c-phone').value = c.contactPhone || '';
  document.getElementById('c-altphone').value = c.contactAltPhone || '';
  document.getElementById('c-address').value = c.contactAddress || '';
  document.getElementById('c-privacy').value = c.privacyText || '';
  document.getElementById('c-terms').value = c.termsText || '';
}

document.getElementById('save-content-btn').onclick = async () => {
  const data = {
    contactEmail: document.getElementById('c-email').value.trim(),
    contactPhone: document.getElementById('c-phone').value.trim(),
    contactAltPhone: document.getElementById('c-altphone').value.trim(),
    contactAddress: document.getElementById('c-address').value.trim(),
    privacyText: document.getElementById('c-privacy').value,
    termsText: document.getElementById('c-terms').value,
    updatedAt: serverTimestamp()
  };
  const msg = document.getElementById('content-message');
  try {
    await setDoc(doc(db, 'site_content', 'main'), data, { merge: true });
    msg.textContent = 'Saved.';
    msg.className = 'form-message visible success';
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'form-message visible error';
  }
};

// ---- Orders ----
async function loadOrders() {
  const tbody = document.querySelector('#orders-table tbody');
  const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
  const snap = await getDocs(q);
  tbody.innerHTML = '';
  snap.forEach(d => {
    const o = d.data();
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(o.customerName)}<br><span style="font-size:.8em;color:#5F6B7A;">${escapeHtml(o.customerEmail)} · ${escapeHtml(o.customerMobile || '')}</span></td>
      <td>${escapeHtml(o.productName)}</td>
      <td>${o.quantity}</td>
      <td><span class="status-pill ${o.status}">${o.status}</span></td>
      <td>
        <select data-status="${d.id}">
          <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
          <option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option>
          <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
        </select>
      </td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-status]').forEach(sel => {
    sel.onchange = async () => {
      await updateDoc(doc(db, 'orders', sel.dataset.status), { status: sel.value });
      loadOrders();
    };
  });
}
</script>
</body>
</html>
